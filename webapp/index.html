<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Hub 2026</title>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{ "family.dash": "./" }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload="none"
        data-sap-ui-libs="sap.m, sap.f, sap.ui.layout">
    </script>
    <style>
        html, body, #content, [data-sap-ui-component] {
            height: 100% !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
        }
        /* This targets the internal UI5 shell container */
        .sapUiBody {
            height: 100% !important;
        }
    </style>
</head>
<body class="sapUiBody">
    <div data-sap-ui-component 
         data-name="family.dash" 
         data-id="container" 
         style="height: 100vh; width: 100vw;"> </div>
</body>
</html>
